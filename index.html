<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIT Nexux - Campus Social Network</title>

  <!-- Meta Tags for SEO -->
  <meta name="description"
    content="SIT Nexux - A vibrant campus social network connecting students, sharing vibes, and building community at SIT." />
  <meta name="keywords" content="campus, social network, students, community, SIT" />
  <meta name="author" content="SIT Nexux" />

  <!-- Open Graph Tags (Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sit-nexux.vercel.app" />
  <meta property="og:title" content="SIT Nexux - Campus Social Network" />
  <meta property="og:description"
    content="A vibrant campus social network connecting students, sharing vibes, and building community." />
  <meta property="og:image"
    content="https://raw.githubusercontent.com/arunishrajput/Sit-Nexux/137c3167650fdb3a3a7070b575b2fba210c57975/og-image.png?token=GHSAT0AAAAAADP7XU2754F2ACUZSM6FUBWO2J4DFQA" />
  <meta property="og:site_name" content="SIT Nexux" />

  <!-- Twitter Card Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SIT Nexux - Campus Social Network" />
  <meta name="twitter:description"
    content="A vibrant campus social network connecting students, sharing vibes, and building community." />
  <meta name="twitter:image"
    content="https://raw.githubusercontent.com/arunishrajput/Sit-Nexux/350b6eb8d74498c2799c7cda4fdbeee02d960c5f/twitter-image.png?token=GHSAT0AAAAAADP7XU26KEAUIWT6JYEM7BAW2J4DHFA" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              750: '#2d3748', // Custom shade for cards if needed
              850: '#1a202c', // Custom darker bg
            }
          },
          fontFamily: {
            brand: ['Righteous', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Righteous&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Dark Mode Body */
    .dark body {
      background-color: #0f172a;
      /* Slate 900 */
      color: #f1f5f9;
      /* Slate 100 */
    }

    /* Custom Scrollbar for cleaner look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Mystery Feature Animations */
    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-10px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 5px #818cf8, 0 0 10px #818cf8;
      }

      50% {
        box-shadow: 0 0 20px #6366f1, 0 0 30px #6366f1;
      }
    }

    .animate-glow {
      animation: glow 2s infinite;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-reveal {
      animation: reveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Gamification Animations */
    @keyframes pop-in {
      0% {
        transform: scale(0);
        opacity: 0;
      }

      60% {
        transform: scale(1.1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-pop {
      animation: pop-in 0.4s ease-out forwards;
    }

    @keyframes float-up-fade {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }

      100% {
        transform: translateY(-50px) scale(1.2);
        opacity: 0;
      }
    }

    .animate-float-text {
      animation: float-up-fade 1.5s ease-out forwards;
    }

    @keyframes confetti {
      0% {
        transform: translateY(0) rotate(0deg);
      }

      100% {
        transform: translateY(100vh) rotate(360deg);
      }
    }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      background-color: #f00;
      animation: confetti 2s ease-out forwards;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
